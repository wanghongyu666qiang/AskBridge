name: 功能建议
description: 提出新功能或改进建议时使用
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？请描述场景而不是只提实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方式
      description: 如果你有想法，描述你期望的使用体验。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: markdown
    attributes:
      value: |
        注意：与「自动点击发送」「读取网页正文」「调用模型 API」相关的建议不符合项目边界（见 README 的使用边界章节），会被直接关闭。
