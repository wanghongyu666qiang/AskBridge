name: CI

on:
  # Branch pushes only: tag pushes run the Release workflow, which rebuilds
  # everything itself, so a parallel CI leg would be pure duplicate load.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Use the native MSVC toolchain supplied by the Windows runner. The
      # project still supports GNU locally (build.rs handles windres), but a
      # single MSVC leg keeps the hosted CI deterministic and matches the
      # standard Windows release environment.
      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, stable branch
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and target artifacts
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msvc-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

  windows-gnu:
    name: Windows (GNU)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust GNU toolchain
        # dtolnay/rust-toolchain, stable branch
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy

      - name: Cache Cargo dependencies and target artifacts
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gnu-cargo-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust 1.85
        # dtolnay/rust-toolchain, stable branch
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85

      # The platform crates only compile on Windows, but the domain logic and
      # release tooling are portable; pinning them to the declared MSRV keeps
      # dependency bumps from silently raising the real toolchain requirement.
      - name: Check MSRV targets
        run: cargo check --locked -p askbridge-core -p xtask

  # License compliance, advisory, and source checks. Runs on Linux because
  # these checks resolve the same locked graph regardless of host platform.
  cargo-deny:
    name: Dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run cargo-deny
        # EmbarkStudios/cargo-deny-action v2
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
