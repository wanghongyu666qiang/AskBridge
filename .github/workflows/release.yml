name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Required by the build-provenance attestation step.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, stable branch
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and target artifacts
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $version = [string](
            $metadata.packages |
              Where-Object { $_.name -eq "askbridge-win" } |
              Select-Object -First 1
          ).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version."
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "askbridge-release-$env:GITHUB_RUN_ID"
          "ASKBRIDGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASKBRIDGE_ARTIFACT_ROOT=$artifactRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Build release packages
        shell: pwsh
        env:
          ASKBRIDGE_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo xtask package --artifact-root "$env:ASKBRIDGE_ARTIFACT_ROOT"

      - name: Validate release packages
        shell: pwsh
        run: |
          $sourceRoot = (Resolve-Path .).Path
          $releaseExe = (Resolve-Path "target/release/askbridge.exe").Path
          cargo xtask validate-package-artifacts `
            --artifact-root "$env:ASKBRIDGE_ARTIFACT_ROOT" `
            --expected-version "$env:ASKBRIDGE_VERSION" `
            --expected-release-exe-path "$releaseExe" `
            --expected-source-root "$sourceRoot" `
            --require-update-signature

      - name: Attest build provenance
        # actions/attest-build-provenance v4. Produces verifiable
        # build-provenance statements for every published artifact; this
        # workflow holds contents:write plus the update signing key, so the
        # signed provenance is part of the release trust chain.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-Setup.exe
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-windows-x64.zip
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-SHA256SUMS.txt
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-SHA256SUMS.txt.sig

      - name: Preserve workflow artifacts
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AskBridge-${{ env.ASKBRIDGE_VERSION }}-windows-x64
          path: |
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-Setup.exe
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-windows-x64.zip
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-SHA256SUMS.txt
            ${{ env.ASKBRIDGE_ARTIFACT_ROOT }}/AskBridge-${{ env.ASKBRIDGE_VERSION }}-SHA256SUMS.txt.sig
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "$env:ASKBRIDGE_ARTIFACT_ROOT/AskBridge-$env:ASKBRIDGE_VERSION-Setup.exe" `
            "$env:ASKBRIDGE_ARTIFACT_ROOT/AskBridge-$env:ASKBRIDGE_VERSION-windows-x64.zip" `
            "$env:ASKBRIDGE_ARTIFACT_ROOT/AskBridge-$env:ASKBRIDGE_VERSION-SHA256SUMS.txt" `
            "$env:ASKBRIDGE_ARTIFACT_ROOT/AskBridge-$env:ASKBRIDGE_VERSION-SHA256SUMS.txt.sig" `
            --verify-tag `
            --generate-notes `
            --title "AskBridge $env:GITHUB_REF_NAME"
