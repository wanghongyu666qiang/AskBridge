name: Download stats

on:
  schedule:
    # 每天 21:30 UTC（北京时间次日 05:30）记录一次累计下载量
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot download counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Count release asset downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          # 只统计用户会主动下载的安装包；SHA256SUMS 是更新器自动拉的，不计入
          # gh api 对每一页分别执行 jq，所以这里对每页的小计再求一次和
          total=$(
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq '[.[].assets[] | select(.name | endswith(".exe") or endswith(".zip")) | .download_count] | add // 0' \
            | awk '{sum += $1} END {print sum + 0}'
          )
          file=docs/download-stats.jsonl
          # 同一天重复运行时替换当天那一行，而不是追加重复记录
          if [ -f "$file" ] && [ "$(tail -n 1 "$file" | jq -r .date 2>/dev/null)" = "$today" ]; then
            sed -i '$d' "$file"
          fi
          printf '{"date":"%s","downloads":%s}\n' "$today" "$total" >> "$file"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download-stats.jsonl
          if git diff --cached --quiet; then
            echo "No change in download counts."
            exit 0
          fi
          git commit -m "Record daily download stats [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
