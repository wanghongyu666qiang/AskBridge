[workspace]
members = [
    "crates/askbridge-core",
    "crates/askbridge-win",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
windows-sys = "0.61"
png = "0.18"
ed25519-dalek = { version = "2.2", default-features = false, features = [
    "fast",
    "std",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
