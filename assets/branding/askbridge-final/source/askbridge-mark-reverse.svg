    <path d="M 100 320 L 100 100 L 320 100"/>
    <path d="M 924 320 L 924 100 L 704 100"/>
    <path d="M 100 704 L 100 924 L 320 924"/>
    <path d="M 924 704 L 924 924 L 704 924"/>
  </g>

