  <title id="title">AskBridge logo — reverse</title>
  <desc id="desc">Reverse-color version of the AskBridge mark for use on dark or photographic backgrounds. The four corner brackets become warm cream and the bridge becomes warm white on a charcoal canvas.</desc>

