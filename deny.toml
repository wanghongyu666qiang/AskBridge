# cargo-deny 配置：依赖许可证合规、漏洞公告与来源检查。
# 本地运行：cargo deny check

[graph]
# 默认检查全部目标的依赖，保证跨工具链（GNU/MSVC）结果一致

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  # 弱 copyleft（文件级），servo 系解析库（cssparser/selectors）等常用
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# warn 而非 deny：workspace 内部的 path 依赖没有版本号，会被误报为通配符
wildcards = "warn"
highlight = "all"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
